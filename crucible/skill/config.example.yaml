# Crucible — a worked non-default configuration
#
# `config.yaml` ships Claude-only so the skill runs the moment you copy it:
# no account, no key, no server. That default is for adoption, not because it
# is the best configuration.
#
# This file is the other end — roughly how it gets run once the optional
# integrations are wired up. Copy the parts you want into your own
# `config.yaml` — the skill's own copy, outside any repository under review.
#
# NOT into a `.crucible.yaml` at a repo root. Most of what is below is exactly
# what a project overlay is clamped from setting: every `integrations.*.enabled:
# true`, every map entry naming a command or an endpoint, every `*_env` naming a
# credential. That file lives in the working tree being reviewed, so it can turn
# an integration OFF and retune thresholds, flags and model slots, but it cannot
# switch one on or point one somewhere new — loadConfig() drops those fields and
# says so on stderr. See "Configuration" in crucible/README.md, and
# OVERLAY_PROTECTED_PATHS in tools/Config.ts for the authoritative list.
#
# WHY BOTHER: the skill's founding argument is that agreement between
# independently-failing reviewers is the strongest signal a finding is real.
# Ten reviewers from one model family share failure modes — they miss the same
# things and hallucinate in the same directions. A cross-family panel is the
# configuration that argument actually implies. The defaults do not deliver it;
# this does.
#
# THE TWO CONFIGURATIONS, SIDE BY SIDE
#
#   role                 config.yaml (shipped)   this file
#   ───────────────────  ──────────────────────  ─────────────────────────────
#   code quality         sonnet                  a gateway model (1.10 combined, thin clean n)
#   security             sonnet                  a second vendor (highest-stakes lens)
#   simplify             sonnet                  gemini-class    (0% vs 8% spurious)
#   typescript           sonnet                  gemini-class    (10% vs 31% spurious)
#   platform             sonnet                  a gateway model (0.95, cheaper AND faster)
#   test runner          sonnet                  external CLI    (0% over 10 samples)
#   clone detector       sonnet (heuristic)      local embeddings (true Type-4)
#   ci tamper            haiku                   haiku           (pattern-match, smallest wins)
#   history analyzer     sonnet                  a gateway model (1.01 combined)
#   pr continuity        sonnet                  sonnet          (zero clean controls, untested)
#   ───────────────────  ──────────────────────  ─────────────────────────────
#   disprove (primary)   haiku                   haiku
#   disprove (2nd vote)  none                    gemini-class    (gates CRITICAL/HIGH)
#   ───────────────────  ──────────────────────  ─────────────────────────────
#   needs                nothing                 a gateway + key, a local
#                                                embedding server, a CLI
#
# What the left column still gives you: the full eleven-phase pipeline, both
# passes, the codebase-pattern baseline, the deny-list, every filter, all ten
# lenses. It is not a demo — it is the whole architecture on one model family.
#
# What the right column adds: reviewers that fail *differently* from each
# other, and a second vendor that must independently fail to disprove a
# CRITICAL or HIGH before it reaches you. That is the difference between one
# model checking its own work ten times and two vendors disagreeing in public.
#
# Start on the left. Move right when the false positives you are still seeing
# look like the kind one model family would share.
#
# READ THE EVAL CAVEATS FIRST. Two rounds of measurement produced the
# assignments below, and both are documented with their limits:
#
#   - CREDITS.md § Model selection — a May 2026 precision-only pilot, n=5–10
#     diffs per model/role, judged by a model. It measures spurious findings on
#     clean code and says nothing about what each model MISSED.
#   - MODEL-SELECTION.md — a July 2026 run that measures both halves: recall
#     against 147 tasks mined from real review history, plus spurious rate
#     against 38 clean-code controls. Read §3 before you trust any single
#     number in this file. Every early standout in that run reversed as
#     clean-task samples accumulated.
#
# Model versions move, prices move faster, and one lens here still has zero
# clean controls behind it. Treat every line below as "what one person measured
# once," not as a recommendation, and re-run the evaluation against your own
# review history before adopting any of it. MODEL-SELECTION.md §10 is the
# procedure for doing that.

# ─────────────────────────────────────────────────────────────────────────────
# Reviewer assignment — deliberately mixed
# ─────────────────────────────────────────────────────────────────────────────
# EVERY `gateway-*` LINE BELOW IS OPT-IN AND NEEDS `integrations.gateway`.
# Copy one slot at a time, not the block. The shipped `config.yaml` runs all ten
# lenses on Claude alone with no account and no key, and that path stays
# supported — nothing here is a new default.
#
# Each comment carries the measured basis and the n behind it, split into recall
# trials and clean-control trials because those are two different sample sizes
# and the second one is the one that decides whether a precision figure means
# anything. A lens with no numbers has no lens-isolated data. Those slots stay
# on the incumbent and say so.
#
# ABOUT THE FALLBACK ORDERS. A failed `gateway-*` slot falls to the one flat
# `reviewer_fallback_chain` below, so the per-lens orders quoted in the comments
# are not something a gateway slot can express here. They are what the gateway
# route should hold if you use one (ci/GATEWAY-ROUTING.md, Option B). Without a
# route, the flat chain applies to every lens alike — a safe outcome and a less
# precise one. One exception does live in this file: an `external_cli_map` entry
# takes a per-entry `fallback:`, tried ahead of the flat chain. There is no
# equivalent field for a gateway entry. The design rule for any order you build:
# every entry is a different vendor, because a fallback exists for an outage and
# three models from one vendor fail together.
models:
  # 1.10 combined (recall n=8 / clean n=2), against the Sonnet incumbent's 1.03
  # on the broad set. Precision 1.00 — measured on TWO clean tasks, which is
  # exactly the thin-sample shape that reversed four other models in this run.
  # Its recall is LOWER than Sonnet's (0.10 vs 0.23). Take this one last.
  # Order: luna-pro → ring → glm (three vendors).
  reviewer_code_quality:      gateway-luna-pro

  # A different vendor on the highest-stakes lens, on purpose. Security is
  # where a shared blind spot costs the most, so it is the first place worth
  # spending vendor diversity.
  #
  # NOT AN EVAL RESULT. This lens was never tested in isolation, so the
  # measurement says nothing about it and did not move it. The second vendor
  # here is an architecture choice that predates the evaluation, not a score.
  # Do not move a security reviewer on general-purpose data.
  # Order: gpt → deepseek-pro → sonnet.
  reviewer_security:          gateway-gpt

  # Swapped on measured precision: 0% spurious against Sonnet's 8%, and it
  # found MORE legitimate issues, not fewer. Prior round only — not re-tested
  # in the later two-metric run, so the recall half is still unmeasured here.
  # Order: gemini → luna → sonnet.
  reviewer_simplify:          gateway-gemini-flash

  # The most counterintuitive result in the pilot and the reason per-role
  # assignment exists at all. The incumbent was the WORST model tested on this
  # role — 31% spurious, flagging type problems in clean TypeScript — while this
  # much cheaper model scored 10% and found three times as many legitimate
  # issues. Prior round only. Note the exact model string: a sibling variant
  # one dot apart in its version scored 0% here, and an earlier version of
  # MODEL-SELECTION.md credited that 0% to this model by mistake.
  # Order: gemini → luna → sonnet.
  reviewer_typescript:        gateway-gemini-flash

  # The best-evidenced swap in the set: 0.95 combined (recall n=11 / clean n=9)
  # against the Sonnet incumbent's 0.67, and it wins on all three axes at once —
  # quality, an order of magnitude less per trial, and a lower median latency.
  # Best-sampled lens in the run, which is why it is the one to try first.
  # Order: deepseek-pro → luna-pro → ring.
  reviewer_platform:          gateway-deepseek-pro

  # Runs the suite and reads failures. An external reasoning CLI scored 0%
  # spurious across 10 samples with 40 legitimate findings — the strongest
  # single result in the pilot. DELIBERATELY NOT ROUTED THROUGH THE GATEWAY: it
  # runs on a flat-rate CLI subscription, so a gateway route moves it onto
  # metered billing and buys nothing the measurement can see.
  reviewer_test_runner:       cli-alt-vendor

  # Real Type-4 clone detection needs embeddings. Local: free, private, and
  # nothing about your codebase leaves the machine. No model selection to make —
  # this slot is not an LLM.
  reviewer_clone_detector:    local-embed

  # Pure YAML pattern-matching. The smallest model is correct here, and a larger
  # one is spend with no gain. Untested in isolation, so the incumbent holds.
  # Order: haiku → a small fast gateway model → luna.
  reviewer_ci_tamper:         claude-haiku

  # 1.01 combined (recall n=9 / clean n=5) against luna 0.89 and the Sonnet
  # incumbent's 0.66. Second reason for this one: it keeps `luna` out of a
  # primary slot. `luna` and `luna-pro` correlate at r=0.97, and two lenses
  # running one opinion is the exact failure the two-pass architecture exists
  # to prevent. Order: deepseek-pro → luna → sonnet.
  reviewer_history_analyzer:  gateway-deepseek-pro

  # STAYS ON THE INCUMBENT, and the reason is the useful part. The newest lens
  # has almost no review history to mine: 2 recall tasks and ZERO clean
  # controls. A model topped that table. Reporting it would be reporting noise,
  # because the precision column is empty by construction. This is an absence
  # of evidence, not a weak result. Order: sonnet → luna → glm.
  reviewer_pr_continuity:     claude-sonnet

  # Pass 2. The primary verdict stays on a small fast model — the disprove task
  # is narrow and well-specified, which is what small models are good at.
  disprove_primary:           claude-haiku

  # The cross-vendor second opinion, and the whole point of the exercise: on
  # CRITICAL and HIGH, a finding survives only if BOTH models fail to disprove
  # it. Two independent failure modes have to agree before you are interrupted.
  disprove_cross_vendor:      gateway-gemini-flash

  embedding_primary:          local-embed

# The final rung must stay claude-* — it dispatches as a local subagent with no
# external dependency, so a reviewer slot can never go empty. Order matters:
# vendor-diverse first (survives one vendor's outage), gateway-free last.
#
# Before you pair any two models across slots, correlate their per-task scores.
# Two models above r≈0.95 are one opinion bought twice, and the pair that looked
# most attractive in this run — the two top scorers overall — turned out to be
# the most correlated pair on the board at r=0.97.
reviewer_fallback_chain:
  - gateway-gemini-flash
  - claude-sonnet

# ─────────────────────────────────────────────────────────────────────────────
# Provider-key maps
# ─────────────────────────────────────────────────────────────────────────────
claude_model_map:
  claude-opus:   opus
  claude-sonnet: sonnet
  claude-haiku:  haiku

# Model strings are whatever your endpoint expects. These are the shapes a
# gateway fronting multiple vendors typically uses — check yours.
#
# A slug names the MODEL. It does not name who serves it. In this run one
# requested slug came back from twelve different serving companies, and every
# call for another was served by a single cloud provider that was not that
# model's own vendor. If you have a data-handling policy, read the response
# envelope's provider field — see ci/GATEWAY-ROUTING.md.
gateway_model_map:
  gateway-gemini-flash: google-ai-studio/gemini-3-flash-preview
  gateway-gpt:          openai/gpt-5.5
  gateway-luna-pro:     openai/gpt-5.6-luna-pro
  gateway-deepseek-pro: deepseek/deepseek-v4-pro
  gateway-embedding:    openai/text-embedding-3-small

local_model_map:
  local-embed:
    endpoint: http://localhost:1234/v1
    model: text-embedding-nomic-embed-text-v1.5
    dim: 768

external_cli_map:
  cli-alt-vendor:
    command: codex
    args: ["exec"]
    reasoning_effort: high
    fallback: claude-sonnet

# ─────────────────────────────────────────────────────────────────────────────
# Integrations
# ─────────────────────────────────────────────────────────────────────────────
integrations:
  # NOTE the api_key_env / base_url_env pattern: these are the NAMES of
  # environment variables. Never put a key, an account identifier, or a private
  # endpoint in this file — it is the file most likely to get committed.
  gateway:
    enabled: true
    # REQUIRED — a literal URL. There is no env-var fallback for this one:
    # `api_key_env` supplies the key, but the endpoint is read from here, and an
    # empty value makes the whole gateway integration unavailable. Every
    # `gateway-*` role then silently falls back to a Claude subagent and the
    # cross-vendor disprove never fires — the config would look applied while
    # buying you none of what this file is for.
    base_url: "https://your-gateway.example/v1"
    api_key_env: "CRUCIBLE_GATEWAY_TOKEN"
    timeout_ms: 60000

  local_models:
    enabled: true

  external_cli:
    enabled: true

  # Accrues the data needed to answer "is the cheap model safe in the
  # authoritative disprove slot?" empirically rather than by argument. Without
  # this, that question stays a matter of taste.
  verdict_log:
    enabled: true
    path: ".crucible/verdicts.jsonl"

  # An extra deep-security phase. Off here — it is the heaviest thing in the
  # repo (Docker, a Postgres index per project, per-scan spend) and worth
  # turning on per-project rather than globally.
  #
  # If you do enable it, read the reaper warning in config.yaml first:
  # quitting Docker Desktop stops EVERY container on the machine, not only
  # this integration's. Set idle_reap_minutes: 0 if you run anything else in
  # Docker.
  metis:
    enabled: false
    compose_dir: ""
    llm:
      base_url_env: "OPENAI_BASE_URL"
      api_key_env: "OPENAI_API_KEY"
    idle_reap_minutes: 0

# ─────────────────────────────────────────────────────────────────────────────
# Everything below matches the shipped defaults and is repeated only so this
# file works standalone. Change these deliberately, not by copying.
# ─────────────────────────────────────────────────────────────────────────────
light_path:
  enabled: true
  allow_extensions: [".md", ".txt", ".rst"]
  allow_paths: []
  max_loc: 1000

risk_tiers:
  # Extends the hardcoded baseline; it cannot replace or disable it. Add the
  # paths your project treats as privileged — admin routes, anything ingesting
  # untrusted input, the config that steers review itself.
  sensitive_paths: []

thresholds:
  confidence_floor:                   80
  per_reviewer_cap:                   5
  large_pr_warn_loc:                  400
  large_pr_block_loc:                 1000
  cross_vendor_disprove_min_severity: HIGH
  clone_mrs_threshold:                0.80   # recalibrate per embedding model — see docs/ClonePatterns.md in the repository (not shipped with the installed skill)
  reviewer_batch:                     4      # pinned rather than `auto`: this panel runs a gateway
                                             # vendor and an external CLI alongside the Claude fleet,
                                             # so the first round is rate-limited often enough that
                                             # paying the batching cost up front beats retrying.
  reviewer_batch_retry:               2
  removal_tracking_max_ratio:         3.0

flags:
  packet_input:                    true
  yaml_output_contract:            true
  scope_constrain_split_severity:  true
  fail_on_revert_gate:             true
  auto_route_delta_review:         true
  python_tabify:                   true
  agent_author_profile:            true
  # The reason most of the above exists.
  cross_vendor_disprove:           true
